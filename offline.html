<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafiya — rollarni tarqatish</title>
<meta name="theme-color" content="#14121c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#14121c;--card:#201d2e;--tx:#f1eefb;--mut:#9a95b3;--ac:#e0314b;--ln:#322e47;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f2fa;--card:#fff;--tx:#1c1a28;--mut:#6b6683;--ln:#dcd8ea;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px;min-height:100vh}
h1{font-size:24px;margin:8px 0 4px;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
button{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:var(--ln);color:var(--tx)}
button.big{width:100%;padding:16px;font-size:19px}
button:disabled{opacity:.4}
.pl{display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--ln)}
.pl:last-child{border:0}
.pl .x{background:none;color:var(--mut);padding:4px 10px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--ln);font-size:14px}
.center{text-align:center}
.name{font-size:30px;font-weight:800;margin:10px 0}
.wheelbox{position:relative;width:290px;height:290px;margin:18px auto}
.wheel{position:absolute;inset:0;border-radius:50%;border:4px solid var(--tx);transition:transform 4s cubic-bezier(.12,.7,.1,1)}
.lbl{position:absolute;left:50%;top:50%;font-size:30px;width:0;height:0;display:flex;align-items:center;justify-content:center}
.ptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:30px;z-index:2;color:var(--tx)}
.hub{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:var(--bg);border:3px solid var(--tx);z-index:1}
.role{font-size:68px}
.rname{font-size:30px;font-weight:800;margin:4px 0}
.rdesc{color:var(--mut);font-size:16px;line-height:1.4}
.team{margin-top:12px;padding:10px;border-radius:12px;background:var(--bg);font-size:15px}
.prog{color:var(--mut);font-size:14px}
.hide{display:none}
.dead span{opacity:.5;text-decoration:line-through}
.fl{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
select{width:100%;margin-top:4px;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:-4px}
.lang button{padding:5px 10px;font-size:13px;border-radius:8px;background:var(--ln);color:var(--tx)}
.lang button.on{background:var(--ac);color:#fff}
.lg{padding:7px 0;border-bottom:1px solid var(--ln);font-size:14px;line-height:1.35}
</style>
</head>
<body>
<div id="app"></div>
<script src="i18n.js?v=3"></script>
<script>
const {t,roleName,roleDesc}=window.I18N;
const R={
 civ:{n:"Мирный житель",e:"👤",c:"#4f8a5b",d:"Днём ищи мафию и голосуй. Особых способностей нет — твоё оружие логика."},
 mafia:{n:"Мафия",e:"🔫",c:"#b3262f",d:"Ночью вместе с командой выбираете жертву. Днём притворяйся мирным."},
 don:{n:"Дон мафии",e:"🎩",c:"#6b1d2c",d:"Глава мафии. Ночью ищет детектива: ведущий кивает, если выбранный — детектив."},
 det:{n:"Детектив",e:"🕵️",c:"#3b6fb0",d:"Каждую ночь проверяешь одного игрока: ведущий показывает, мафия он или нет."},
 ast:{n:"Помощник детектива",e:"🔎",c:"#5b8fc7",d:"Знает, кто детектив, и помогает ему. Если детектив выбыл — продолжает проверки."},
 doc:{n:"Доктор",e:"💉",c:"#2f9e8f",d:"Каждую ночь лечишь одного игрока — спасаешь от убийства. Себя можно лечить лишь один раз."},
 nurse:{n:"Медсестра",e:"🩺",c:"#52b8aa",d:"Помощница доктора. Если доктора убили — ты берёшь его роль и лечишь вместо него."},
 man:{n:"Маньяк",e:"🔪",c:"#d9822b",d:"Играешь сам за себя. Каждую ночь убиваешь одного. Победа — остаться последним."},
 mis:{n:"Любовница",e:"💋",c:"#c2549b",d:"Каждую ночь выбираешь игрока: он пропускает своё ночное действие. Не выбирай одного дважды подряд."}
};
const ORDER=["civ","mafia","don","det","ast","doc","nurse","man","mis"];

function composition(N){
 const m=N<=6?1:N<=9?2:N<=12?3:N<=15?4:5+Math.floor((N-16)/4);
 const c={};
 c.don=N>=10?1:0;
 c.mafia=m-c.don;
 c.det=1; c.doc=1;
 c.man=N>=7?1:0;
 c.mis=N>=8?1:0;
 c.nurse=N>=11?1:0;
 c.ast=N>=12?1:0;
 const used=Object.values(c).reduce((a,b)=>a+b,0);
 c.civ=N-used;
 return c;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let S={phase:"setup",players:[],roles:[],i:0,spun:false,rot:0};
const app=document.getElementById("app");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function compChips(c){
 return ORDER.filter(k=>c[k]>0).map(k=>`<span class="chip">${R[k].e} ${roleName(k)}: <b>${c[k]}</b></span>`).join("");
}

function langBar(){
 const d=document.createElement("div");d.className="lang";
 d.innerHTML=I18N.LANGS.map(l=>`<button data-lang="${l}" class="${I18N.lang===l?"on":""}">${l.toUpperCase()}</button>`).join("");
 d.querySelectorAll("button").forEach(b=>b.onclick=()=>{I18N.setLang(b.dataset.lang);render()});
 app.prepend(d);
}
function render(){
 // pass (wheel spinning) is skipped so switching language can't interrupt a spin
 if(S.phase==="setup"){setup();return langBar()}
 if(S.phase==="pass")return pass();
 if(S.phase==="result")return result();
 if(S.phase==="done"){done();return langBar()}
 if(S.phase==="game")return game();
}

function setup(){
 const N=S.players.length,ok=N>=5;
 const c=ok?composition(N):null;
 app.innerHTML=`
 <h1>🎭 ${t("mafia")}</h1><p class="sub">${t("off_sub")}</p>
 <div class="card">
  <div class="row"><input id="nm" placeholder="${t("off_name_ph")}" maxlength="20" autocomplete="off"><button id="add">${t("add")}</button></div>
 </div>
 <div class="card">
  <b>${t("players_n",N)}</b>
  ${N?S.players.map((p,i)=>`<div class="pl"><span>${i+1}. ${esc(p)}</span><button class="x" data-i="${i}">✕</button></div>`).join(""):`<p class="sub" style="margin:10px 0 0">${t("nobody_yet",5)}</p>`}
 </div>
 <div class="card"><b>${t("roles_in_game")}</b>
  ${ok?`<div class="chips" style="margin-top:10px">${compChips(c)}</div>`:`<p class="sub" style="margin:10px 0 0">${t("off_need",5-N)}</p>`}
 </div>
 <button class="big" id="go" ${ok?"":"disabled"}>${t("deal")}</button>`;
 const inp=document.getElementById("nm");
 const add=()=>{const v=inp.value.trim();if(!v)return;S.players.push(v);render();document.getElementById("nm").focus()};
 document.getElementById("add").onclick=add;
 inp.onkeydown=e=>{if(e.key==="Enter")add()};
 app.querySelectorAll(".x").forEach(b=>b.onclick=()=>{S.players.splice(+b.dataset.i,1);render()});
 document.getElementById("go").onclick=start;
}

function start(){
 const c=composition(S.players.length),list=[];
 ORDER.forEach(k=>{for(let j=0;j<c[k];j++)list.push(k)});
 S.roles=shuffle(list);S.i=0;S.phase="pass";S.spun=false;S.rot=0;render();
}

function pass(){
 const N=S.players.length;
 const kinds=ORDER.filter(k=>S.roles.includes(k));
 const a=360/kinds.length;
 const grad=kinds.map((k,i)=>`${R[k].c} ${i*a}deg ${(i+1)*a}deg`).join(",");
 const lbls=kinds.map((k,i)=>{const m=i*a+a/2;return `<div class="lbl" style="transform:rotate(${m}deg) translateY(-108px) rotate(${-m}deg)">${R[k].e}</div>`}).join("");
 app.innerHTML=`
 <div class="center">
  <p class="prog">${t("player_of",S.i+1,N)}</p>
  <p class="sub" style="margin:0">${t("pass_phone")}</p>
  <div class="name">${esc(S.players[S.i])}</div>
  <div class="wheelbox"><div class="ptr">▼</div>
   <div class="wheel" id="wh" style="background:conic-gradient(${grad})">${lbls}</div><div class="hub"></div></div>
  <button class="big" id="spin">${t("spin")}</button>
  <p class="sub" style="margin-top:12px">${t("no_peek")}</p>
 </div>`;
 document.getElementById("spin").onclick=function(){
  this.disabled=true;
  const k=S.roles[S.i],idx=kinds.indexOf(k),mid=idx*a+a/2;
  const jitter=(Math.random()-.5)*a*.6;
  const rot=360*5+(360-mid)+jitter;
  document.getElementById("wh").style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{S.phase="result";render()},4400);
 };
}

function result(){
 const k=S.roles[S.i],r=R[k],N=S.players.length;
 let team="";
 if(k==="mafia"||k==="don"){
  const mates=S.players.filter((p,j)=>j!==S.i&&(S.roles[j]==="mafia"||S.roles[j]==="don")).map(esc);
  team=mates.length?`<div class="team">${t("your_team")}: <b>${mates.join(", ")}</b></div>`:`<div class="team">${t("alone_mafia")}</div>`;
 }
 app.innerHTML=`
 <div class="center">
  <p class="prog">${t("player_of",S.i+1,N)} · ${esc(S.players[S.i])}</p>
  <div class="card" style="border-color:${r.c};margin-top:16px;padding:24px 16px">
   <div class="role">${r.e}</div>
   <div class="rname" style="color:${r.c}">${roleName(k)}</div>
   <div class="rdesc">${roleDesc(k)}</div>${team}
  </div>
  <button class="big" id="nx">${t(S.i+1<N?"next_player":"finish")}</button>
 </div>`;
 document.getElementById("nx").onclick=()=>{S.i++;if(S.i<N){S.phase="pass"}else{newGame();return game()}render()};
}

function done(){
 app.innerHTML=`
 <div class="center"><h1>${t("dealt")}</h1><p class="sub">${t("dealt_sub")}</p></div>
 <div class="card"><b>${t("composition")}</b><div class="chips" style="margin-top:10px">${compChips(composition(S.players.length))}</div></div>
 <div class="card"><b>${t("cheat")}</b>
  <p class="sub" style="text-align:left">${t("cheat_sub")}</p>
  <button class="sec big" id="rv">${t("show_all")}</button>
  <div id="all" class="hide"></div>
 </div>
 <button class="big" id="bg" style="margin-bottom:10px">${t("back_game")}</button>
 <button class="sec big" id="again">${t("redeal")}</button>
 <button class="sec big" id="back" style="margin-top:10px">${t("edit_players")}</button>`;
 document.getElementById("rv").onclick=function(){
  const all=document.getElementById("all");
  const open=all.classList.toggle("hide")===false;
  this.textContent=t(open?"hide_roles":"show_all");
  all.innerHTML=S.players.map((p,j)=>`<div class="pl"><span>${esc(p)}</span><span>${R[S.roles[j]].e} ${roleName(S.roles[j])}</span></div>`).join("");
 };
 document.getElementById("bg").onclick=()=>{S.phase="game";render()};
 document.getElementById("again").onclick=start;
 document.getElementById("back").onclick=()=>{S.phase="setup";render()};
}
const isM=k=>k==="mafia"||k==="don";
function logText(l){return typeof l==="string"?l:`${t(l[0],l[1])}: ${t(l[2],...l.slice(3))}`}
function newGame(){S.phase="game";S.dead=S.players.map(()=>false);S.log=[];S.round=1;S.stage="night";S.votes={};S.night={};S.showRoles=false}
function alive(){return S.players.map((p,i)=>i).filter(i=>!S.dead[i])}
function winner(){
 const a=alive(),m=a.filter(i=>isM(S.roles[i])).length,mn=a.filter(i=>S.roles[i]==="man").length,c=a.length-m-mn;
 if(!m&&!mn)return t("win_civ");
 if(mn&&m+c<=1)return t("win_man");
 if(!mn&&m>=c)return t("win_maf");
 return "";
}
function opts(sel){return `<option value="">${t("nobody")}</option>`+alive().map(i=>`<option value="${i}" ${String(i)===String(sel)?"selected":""}>${esc(S.players[i])}</option>`).join("")}
function game(){
 S.phase="game";
 const y=scrollY,a=alive(),w=winner(),night=S.stage==="night",has=k=>S.roles.includes(k),pre=[night?"lg_night":"lg_day",S.round];
 let h=`<h1>${t(night?"night_n":"day_n",S.round)}</h1><p class="sub">${t("alive_n",a.length,S.players.length)}</p>`;
 if(w)h+=`<div class="card center" style="border-color:var(--ac)"><b style="font-size:20px">${w}</b></div>`;
 h+=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><b>${t("players")}</b><button class="sec" id="tr" style="padding:6px 10px;font-size:14px">${t(S.showRoles?"hide_roles":"show_roles")}</button></div>`
 +S.players.map((p,i)=>`<div class="pl ${S.dead[i]?"dead":""}"><span>${S.dead[i]?"💀":"🙂"} ${esc(p)}${S.showRoles?` · ${R[S.roles[i]].e} ${roleName(S.roles[i])}`:""}</span><button class="x tg" data-i="${i}" style="font-size:14px">${t(S.dead[i]?"revive":"out")}</button></div>`).join("")+`</div>`;
 if(night){
  const f=(k,l,s)=>s?`<label class="fl">${l}<select data-k="${k}">${opts(S.night[k]??"")}</select></label>`:"";
  h+=`<div class="card"><b>${t("night_actions")}</b>`+f("mk",t("f_mk"),1)+f("mn",t("f_mn"),has("man"))+f("dc",t("f_dc"),has("doc"))+f("ms",t("f_ms"),has("mis"))+f("dt",t("f_dt"),has("det"))+`<button class="big" id="en" style="margin-top:14px">${t("end_night")}</button></div>`;
 }else{
  h+=`<div class="card"><b>${t("voting")}</b>`+a.map(i=>`<div class="pl"><span>${esc(S.players[i])}</span><span><button class="sec vb" data-i="${i}" data-d="-1" style="padding:4px 14px">−</button> <b style="display:inline-block;min-width:28px;text-align:center">${S.votes[i]||0}</b> <button class="vb" data-i="${i}" data-d="1" style="padding:4px 14px">+</button></span></div>`).join("")+`<button class="big" id="ev" style="margin-top:14px">${t("end_vote")}</button><button class="sec big" id="sk" style="margin-top:8px">${t("no_exile")}</button></div>`;
 }
 h+=`<div class="card"><b>${t("log")}</b>`+(S.log.length?S.log.slice().reverse().map(l=>`<div class="lg">${logText(l)}</div>`).join(""):`<p class="sub" style="margin:8px 0 0;text-align:left">${t("empty")}</p>`)+`</div><button class="sec big" id="mn">${t("host_menu_btn")}</button>`;
 app.innerHTML=h;langBar();scrollTo(0,y);
 document.getElementById("tr").onclick=()=>{S.showRoles=!S.showRoles;game()};
 document.getElementById("mn").onclick=()=>{S.phase="done";render()};
 app.querySelectorAll("select").forEach(s=>s.onchange=()=>{S.night[s.dataset.k]=s.value});
 app.querySelectorAll(".tg").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;S.dead[i]=!S.dead[i];S.log.push([...pre,"lg_manual",esc(S.players[i]),!!S.dead[i]]);game()});
 app.querySelectorAll(".vb").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;S.votes[i]=Math.max(0,(S.votes[i]||0)+ +b.dataset.d);game()});
 const en=document.getElementById("en");if(en)en.onclick=endNight;
 const ev=document.getElementById("ev");if(ev)ev.onclick=()=>endVote(false);
 const sk=document.getElementById("sk");if(sk)sk.onclick=()=>endVote(true);
}
function endNight(){
 const n=S.night,a=alive(),nm=i=>esc(S.players[i]),L=(k,...x)=>S.log.push(["lg_night",S.round,k,...x]);
 const g=k=>n[k]===undefined||n[k]===""?null:+n[k];
 const mk=g("mk"),mn=g("mn"),dc=g("dc"),ms=g("ms"),dt=g("dt"),bl=ms!==null?S.roles[ms]:null;
 if(ms!==null)L("lg_blocked",nm(ms));
 let saved=null;
 if(dc!==null){
  const healer=a.some(i=>(S.roles[i]==="doc"||S.roles[i]==="nurse")&&i!==ms);
  if(healer){saved=dc;L("lg_healed",nm(dc))}else L("lg_heal_fail",nm(dc));
 }
 if(dt!==null){if(bl==="det")L("lg_det_fail");else L("lg_det",nm(dt),isM(S.roles[dt]))}
 let any=false;
 [[mk,"maf"],[mn,"man"]].forEach(([tg,by])=>{
  if(tg===null)return;
  if(by==="man"&&bl==="man"){L("lg_man_blocked");return}
  if(tg===saved){L("lg_saved",by,nm(tg));return}
  if(!S.dead[tg]){S.dead[tg]=true;any=true;L("lg_killed",by,nm(tg))}
 });
 if(!any)L("lg_nobody_died");
 S.stage="day";S.votes={};S.night={};game();
}
function endVote(skip){
 const a=alive();let max=0;a.forEach(i=>max=Math.max(max,S.votes[i]||0));
 const top=a.filter(i=>(S.votes[i]||0)===max),D=(k,...x)=>S.log.push(["lg_day",S.round,k,...x]);
 if(skip||max===0)D("lg_no_exile");
 else if(top.length>1)D("lg_tie",top.map(i=>esc(S.players[i])).join(", "),max);
 else{S.dead[top[0]]=true;D("lg_exiled",esc(S.players[top[0]]),max)}
 S.round++;S.stage="night";S.votes={};game();
}
render();
</script>
</body>
</html>
