<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafiya onlayn</title>
<style>
:root{--bg:#14121c;--card:#201d2e;--tx:#f1eefb;--mut:#9a95b3;--ac:#e0314b;--ok:#3fae6a;--ln:#322e47;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f2fa;--card:#fff;--tx:#1c1a28;--mut:#6b6683;--ln:#dcd8ea;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px;min-height:100vh}
h1{font-size:24px;margin:8px 0 4px;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
input.code{text-transform:uppercase;letter-spacing:4px;text-align:center;font-weight:700}
button{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:var(--ln);color:var(--tx)}
button.big{width:100%;padding:16px;font-size:19px}
button.sm{padding:6px 10px;font-size:14px}
button:disabled{opacity:.4}
.pl{display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--ln);gap:8px}
.pl:last-child{border:0}
.pl .x{background:none;color:var(--mut);padding:4px 10px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--ln);font-size:14px}
.center{text-align:center}
.role{font-size:68px}
.rname{font-size:30px;font-weight:800;margin:4px 0}
.rdesc{color:var(--mut);font-size:16px;line-height:1.4}
.team{margin-top:12px;padding:10px;border-radius:12px;background:var(--bg);font-size:15px}
.dead span.n{opacity:.5;text-decoration:line-through}
.fl{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
select{width:100%;margin-top:4px;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.lg{padding:7px 0;border-bottom:1px solid var(--ln);font-size:14px;line-height:1.35}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.dot.off{background:var(--mut);opacity:.5}
.link{word-break:break-all;font-size:15px;padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--ln);margin:8px 0}
.qr{display:block;width:200px;height:200px;margin:8px auto;background:#fff;border-radius:12px;padding:10px}
.qr svg{display:block;width:100%;height:100%}
.bigcode{font-size:36px;font-weight:800;letter-spacing:6px;text-align:center;margin:4px 0}
.err{color:var(--ac);font-size:14px;margin-top:8px;min-height:1em}
.banner{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;text-align:center;padding:6px;border-radius:10px;font-size:14px;margin-bottom:10px}
.mt{margin-top:10px}
a{color:var(--mut)}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:-4px}
.lang button{padding:5px 10px;font-size:13px;border-radius:8px;background:var(--ln);color:var(--tx)}
.lang button.on{background:var(--ac);color:#fff}
.act{text-align:left;margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}
.card>.act:first-child{margin-top:0;padding-top:0;border:0}
.targets{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 8px}
.targets button{padding:9px 12px;font-size:15px}
.targets button.on{background:var(--ac)}
.picks{font-size:13px;color:var(--mut);margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<script src="vendor/mqtt-5.10.4.min.js"></script>
<script src="vendor/qrcode-generator-1.4.4.js"></script>
<script src="i18n.js"></script>
<script src="roles.js"></script>
<script src="room.js"></script>
<script src="bots.js"></script>
<script>
const {R,ORDER,MIN_PLAYERS,composition,isMafia}=window.MafiaRoles;
const {t,roleName,roleDesc,errText}=window.I18N;
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);

// ---------- local storage (best effort) ----------
const store={
 get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
 del(k){try{localStorage.removeItem(k)}catch{}}
};
const SESSION_KEY="mafia:session"; // {kind:'host'|'player', code, token}
const hostGameKey=code=>"mafia:host:"+code;

// ---------- app state ----------
const urlRoom=(new URLSearchParams(location.search).get("room")||"").trim().toUpperCase();
const BASE=location.origin+location.pathname.replace(/index\.html$/,"");
let V={screen:"loading",err:"",state:null,secret:null,showRole:false,me:null,session:store.get(SESSION_KEY)};
let G=null; // host-side game tracker (only on the host's device)

function inviteLink(code){return `${BASE}?room=${code}`}
function setSession(s){V.session=s;s?store.set(SESSION_KEY,s):store.del(SESSION_KEY)}

// ---------- networking: public MQTT brokers over secure WebSockets ----------
// There is no game server. The host's browser holds the room; players send messages to it
// through free public MQTT brokers (plain WSS, no WebRTC, so it works on mobile networks).
// The host listens on every broker it can reach; each player uses whichever one works for them.
// Messages are end-to-end encrypted (ECDH P-256 + AES-GCM), so nobody watching a broker sees roles.
// window.MAFIA_MQTT can replace the broker list (array of wss:// URLs).
const BROKERS=window.MAFIA_MQTT||["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081/mqtt"];
const TOPIC="mafiyagame/v1/";
const rs=new MafiaRoom.RoomStore();
const roomKey=code=>"mafia:room:"+code;
let HR=null,hostPriv=null,clients=[],pc=null,heartbeat=null,wakeLock=null,lastHeard=0;
const conns=new Map(); // host: cid -> {cid,pub,key,client,playerId,seen}
const net={online:false};
const randHex=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,"0")).join("");

// ----- crypto -----
const b64=buf=>{const a=new Uint8Array(buf);let s="";for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ECDH={name:"ECDH",namedCurve:"P-256"};
const genKeys=()=>crypto.subtle.generateKey(ECDH,true,["deriveKey"]);
const exportPub=async k=>b64(await crypto.subtle.exportKey("raw",k));
async function derive(priv,pubB64){
 const pub=await crypto.subtle.importKey("raw",unb64(pubB64),ECDH,false,[]);
 return crypto.subtle.deriveKey({name:"ECDH",public:pub},priv,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function seal(key,obj){
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const d=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj)));
 return {iv:b64(iv),d:b64(d)};
}
async function unseal(key,m){
 const d=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(m.iv)},key,unb64(m.d));
 return JSON.parse(new TextDecoder().decode(d));
}

// ----- brokers -----
function connectBroker(url){
 return new Promise((res,rej)=>{
  let c;
  try{c=mqtt.connect(url,{clientId:"mf_"+randHex(8),clean:true,connectTimeout:8000,reconnectPeriod:3000,keepalive:30})}catch(e){return rej(e)}
  const t=setTimeout(()=>{c.end(true);rej(new Error("timeout "+url))},10000);
  c.once("connect",()=>{clearTimeout(t);res(c)});
  c.on("error",()=>{});
 });
}
function stopNet(clearRoom){
 clearBotTimers();
 clearInterval(heartbeat);heartbeat=null;
 if(clearRoom&&HR)clients.forEach(c=>{try{c.publish(TOPIC+HR.code+"/k","",{retain:true,qos:1})}catch{}});
 const old=clients;clients=[];setTimeout(()=>old.forEach(c=>{try{c.end(true)}catch{}}),clearRoom?800:0);
 if(pc){try{pc.client.end(true)}catch{}pc=null}
 conns.clear();net.online=false;hostPriv=null;
 if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}
}
function goHome(){
 if(HR)store.del(roomKey(HR.code));
 stopNet(true);setSession(null);G=null;HR=null;V.state=null;V.secret=null;V.err="";
 history.replaceState(null,"",location.pathname);V.screen="home";render();
}

// Keep the host's screen on: if the host phone sleeps, players can't reach the room.
async function keepAwake(){
 try{if("wakeLock" in navigator&&!wakeLock&&document.visibilityState==="visible"){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null})}}catch{}
}
document.addEventListener("visibilitychange",()=>{if(HR)keepAwake()});

// ----- host side -----
const ALIVE_MS=25000; // a player is shown offline after this long without a message
function sendTo(conn,obj){
 if(!HR)return;
 seal(conn.key,obj).then(s=>{try{conn.client.publish(TOPIC+HR.code+"/p/"+conn.cid,JSON.stringify(s),{qos:1})}catch{}});
}
function hostBroadcast(){
 if(!HR)return;
 store.set(roomKey(HR.code),HR);
 const st=rs.publicState(HR);
 conns.forEach(c=>{if(c.playerId)sendTo(c,{t:"sync",state:st,secret:rs.secretFor(HR,c.playerId)})});
 onHostState(rs.hostView(HR));render();
 scheduleBots();
}
// ----- bots (run here, on the host's device) -----
const botTimers=new Map();let botStage="";
function clearBotTimers(){botTimers.forEach(clearTimeout);botTimers.clear()}
// Each living bot makes its move a few seconds into the night / day, like a person would.
function scheduleBots(){
 if(!HR||!HR.started||HR.game.winner)return clearBotTimers();
 const sk=HR.game.round+":"+HR.game.stage;
 if(sk!==botStage){clearBotTimers();botStage=sk}
 HR.players.forEach(p=>{
  if(!p.bot||HR.game.dead[p.id])return;
  Object.keys(rs.actionsFor(HR,p.id)).forEach(kind=>{
   const key=p.id+":"+kind;
   if(botTimers.has(key)||(HR.picks[p.id]&&HR.picks[p.id][kind]!==undefined))return;
   const day=kind==="vote",delay=MafiaBots.urgent(rs,HR,p.id,kind)?1500+Math.random()*1500:day?5000+Math.random()*9000:1500+Math.random()*5000;
   botTimers.set(key,setTimeout(()=>{
    if(!HR||HR.game.round+":"+HR.game.stage!==sk)return;
    try{const tg=MafiaBots.decide(rs,HR,p.id,kind);if(tg!=null){rs.setPick(HR,p.id,kind,tg);hostBroadcast()}}catch(e){console.warn(e)}
   },delay));
  });
 });
}
function refreshConnected(){
 const now=Date.now();let changed=false;
 HR.players.forEach(p=>{
  const on=!!p.bot||[...conns.values()].some(c=>c.playerId===p.id&&now-c.seen<ALIVE_MS);
  if(p.connected!==on){p.connected=on;changed=true}
 });
 return changed;
}
function bindConn(conn,p){
 // One live connection per player: a reloaded page replaces the old one.
 conns.forEach((c,k)=>{if(c!==conn&&c.playerId===p.id)conns.delete(k)});
 conn.playerId=p.id;p.connected=true;
}
async function onHostMessage(client,payload){
 if(!HR||!hostPriv)return;
 let m;try{m=JSON.parse(payload.toString())}catch{return}
 if(!m||typeof m.c!=="string"||m.c.length>40||typeof m.pub!=="string"||m.pub.length>200)return;
 let conn=conns.get(m.c);
 if(!conn||conn.pub!==m.pub){
  let key;try{key=await derive(hostPriv,m.pub)}catch{return}
  conn={cid:m.c,pub:m.pub,key,client,playerId:null,seen:0};conns.set(m.c,conn);
 }
 let msg;try{msg=await unseal(conn.key,m)}catch{return}
 if(!msg||typeof msg!=="object")return;
 conn.client=client;conn.seen=Date.now();
 const reply=o=>sendTo(conn,o);
 const type=msg.t==="leave"?"left":msg.t==="act"?"acted":"joined";
 try{
  if(msg.t==="ping"){
   // Heartbeat; also re-binds a player after the host reloaded the page.
   let p=null;try{p=rs.findPlayer(HR,msg.token)}catch{}
   if(p&&conn.playerId!==p.id){bindConn(conn,p);return hostBroadcast()}
   if(refreshConnected())hostBroadcast();
   return reply({t:"pong"});
  }
  if(msg.t==="join"){
   const {player}=rs.join(HR.code,msg.name);
   bindConn(conn,player);
   reply({t:type,ok:true,token:player.token,playerId:player.id,name:player.name});
  }else if(msg.t==="resume"){
   const p=rs.findPlayer(HR,msg.token);
   bindConn(conn,p);
   reply({t:type,ok:true,playerId:p.id,name:p.name});
  }else if(msg.t==="leave"){
   const p=rs.findPlayer(HR,msg.token);
   rs.remove(HR,p.id);conn.playerId=null;
   reply({t:type,ok:true});
  }else if(msg.t==="act"){
   const p=rs.findPlayer(HR,msg.token);
   rs.setPick(HR,p.id,String(msg.kind||""),msg.target);
   reply({t:type,ok:true});
  }else return;
  hostBroadcast();
 }catch(e){reply({t:type,ok:false,code:e.code||"error",error:e.message||""})}
}
function hostOnline(){net.online=clients.some(c=>c.connected);render()}
function attachHostClient(c){
 if(!HR){c.end(true);return}
 const code=HR.code;
 const announce=()=>{c.subscribe(TOPIC+code+"/h",{qos:1});c.publish(TOPIC+code+"/k",JSON.stringify({pub:HR.hostKey.pub}),{retain:true,qos:1})};
 announce();
 c.on("connect",()=>{announce();hostOnline()});
 c.on("close",hostOnline);c.on("offline",hostOnline);
 c.on("message",(topic,payload)=>{if(topic===TOPIC+code+"/h")onHostMessage(c,payload)});
 clients.push(c);hostOnline();
}
// Connects to every broker it can; resolves true as soon as one works.
async function startHost(){
 const priv=await crypto.subtle.importKey("jwk",HR.hostKey.priv,ECDH,false,["deriveKey"]);
 hostPriv=priv;
 clearInterval(heartbeat);
 heartbeat=setInterval(()=>{
  if(!HR)return;
  conns.forEach((c,k)=>{if(Date.now()-c.seen>5*60000)conns.delete(k)});
  if(refreshConnected())hostBroadcast();
 },5000);
 keepAwake();
 return new Promise(res=>{
  let left=BROKERS.length,done=false;
  BROKERS.forEach(url=>connectBroker(url).then(c=>{
   if(hostPriv!==priv){c.end(true);return}
   attachHostClient(c);if(!done){done=true;res(true)}
  },()=>{if(--left===0&&!done){done=true;res(false)}}));
 });
}
const hostOps={
 async "host:create"(){
  stopNet();
  const room=rs.create();
  const keys=await genKeys();
  room.hostKey={priv:await crypto.subtle.exportKey("jwk",keys.privateKey),pub:await exportPub(keys.publicKey)};
  HR=room;
  if(await startHost()){
   store.set(roomKey(room.code),room);
   return {ok:true,code:room.code,hostToken:room.hostToken,state:rs.hostView(room)};
  }
  stopNet();rs.rooms.delete(room.code);HR=null;
  return {ok:false,error:t("err_net")};
 },
 "host:kick"(d){
  const p=rs.remove(HR,Number(d.playerId));
  if(p)conns.forEach((c,k)=>{if(c.playerId===p.id){sendTo(c,{t:"kicked"});conns.delete(k)}});
  hostBroadcast();return {ok:true};
 },
 "host:start"(){rs.start(HR);hostBroadcast();return {ok:true,state:rs.hostView(HR)}},
 "host:game"(d){rs.updateGame(HR,d.game);hostBroadcast();return {ok:true}},
 "host:addbot"(){rs.addBot(HR);hostBroadcast();return {ok:true}},
 "host:reset"(){rs.reset(HR);hostBroadcast();return {ok:true,state:rs.hostView(HR)}}
};

// ----- player side -----
let pending=null; // {type, resolve}
// Tries all brokers at once; uses the first one where the host's room is announced.
function findHost(code){
 return new Promise((res,rej)=>{
  let left=BROKERS.length,done=false,sawBroker=false;
  const fail=()=>{if(--left===0&&!done){done=true;rej(new Error(t(sawBroker?"err_host_offline":"err_net")))}};
  BROKERS.forEach(url=>connectBroker(url).then(c=>{
   if(done){c.end(true);return}
   sawBroker=true;
   const kt=TOPIC+code+"/k";
   const t=setTimeout(()=>{c.end(true);fail()},8000);
   const first=(topic,payload)=>{
    if(topic!==kt)return;
    let pub=null;try{pub=JSON.parse(payload.toString()).pub}catch{}
    clearTimeout(t);c.removeListener("message",first);
    if(done||!pub){c.end(true);if(!pub)fail();return}
    done=true;res({client:c,hostPub:pub});
   };
   c.on("message",first);
   c.subscribe(kt,{qos:1});
  },fail));
 });
}
async function playerConnect(code){
 if(pc&&pc.code===code&&pc.client.connected)return pc;
 if(pc){try{pc.client.end(true)}catch{}pc=null}
 const {client,hostPub}=await findHost(code);
 const keys=await genKeys();
 const me={client,code,cid:randHex(10),pub:await exportPub(keys.publicKey),priv:keys.privateKey,key:await derive(keys.privateKey,hostPub),hostPub};
 const pt=TOPIC+code+"/p/"+me.cid,kt=TOPIC+code+"/k";
 client.subscribe(pt,{qos:1});
 client.on("message",async(topic,payload)=>{
  if(pc!==me)return;
  if(topic===kt){ // host re-announced (same key after a reload; a new key means a new room)
   let pub=null;try{pub=JSON.parse(payload.toString()).pub}catch{}
   if(!pub){net.online=false;V.err=t("err_host_closed");render()}
   return;
  }
  if(topic!==pt)return;
  let msg;try{msg=await unseal(me.key,JSON.parse(payload.toString()))}catch{return}
  onPlayerMessage(msg);
 });
 client.on("close",()=>{if(pc===me){net.online=false;render()}});
 pc=me;
 startPlayerHeartbeat();
 return me;
}
function playerSend(obj){
 if(!pc)return false;
 seal(pc.key,obj).then(s=>{try{pc.client.publish(TOPIC+pc.code+"/h",JSON.stringify({c:pc.cid,pub:pc.pub,...s}),{qos:1})}catch{}});
 return true;
}
function onPlayerMessage(msg){
 if(!msg||typeof msg!=="object")return;
 lastHeard=Date.now();
 if(!net.online){net.online=true;V.err="";render()}
 if(pending&&msg.t===pending.type){const p=pending;pending=null;p.resolve(msg);return}
 if(msg.t==="sync"){V.state=msg.state;if(!msg.secret)V.showRole=false;V.secret=msg.secret;render()}
 else if(msg.t==="kicked"){stopNet();setSession(null);V.screen="kicked";render()}
}
function startPlayerHeartbeat(){
 clearInterval(heartbeat);
 heartbeat=setInterval(()=>{
  if(!pc||V.session?.kind!=="player")return;
  playerSend({t:"ping",token:V.session.token});
  if(net.online&&Date.now()-lastHeard>ALIVE_MS){net.online=false;render()}
 },8000);
}
function request(msg,type){
 return new Promise(res=>{
  const t=setTimeout(()=>{if(pending&&pending.type===type)pending=null;res({ok:false,error:t("err_host_silent")})},12000);
  pending={type,resolve:r=>{clearTimeout(t);res(r)}};
  if(!playerSend(msg)){clearTimeout(t);pending=null;res({ok:false,error:t("err_no_host_link")})}
 });
}
async function playerResume(retry=3000){
 const s=V.session;if(!s||s.kind!=="player")return;
 try{await playerConnect(s.code)}catch(e){V.err=e.message;render();return setTimeout(()=>playerResume(Math.min(retry*1.5,15000)),retry)}
 const r=await request({t:"resume",token:s.token},"joined");
 if(r.ok){V.me={id:r.playerId,name:r.name};net.online=true;lastHeard=Date.now();V.err="";V.screen="player";render();return}
 if(r.code==="no_player"||r.code==="no_room"){stopNet();setSession(null);V.screen="join";V.err=t("err_not_in_room");return render()}
 V.err=errText(r);render();setTimeout(()=>playerResume(Math.min(retry*1.5,15000)),retry);
}
const playerOps={
 async "player:join"(d){
  try{await playerConnect(d.code)}catch(e){return {ok:false,error:e.message}}
  const r=await request({t:"join",name:d.name},"joined");
  if(r.ok){net.online=true;lastHeard=Date.now()}
  return r;
 },
 async "player:act"(d){return request({t:"act",token:V.session.token,kind:d.kind,target:d.target},"acted")},
 async "player:leave"(d){if(pc)await request({t:"leave",token:d.token},"left");return {ok:true}}
};

async function emit(ev,data){
 const fn=hostOps[ev]||playerOps[ev];
 if(!fn)return {ok:false,error:"unknown"};
 try{return await fn(data||{})}catch(e){return {ok:false,code:e.code,error:e.message||t("err_generic")}}
}

// ---------- startup ----------
async function boot(){
 const s=V.session;
 if(s&&(!urlRoom||urlRoom===s.code)){
  if(s.kind==="host"){
   const saved=store.get(roomKey(s.code));
   if(saved&&saved.hostToken===s.token&&saved.hostKey){
    HR=rs.restore(saved);onHostState(rs.hostView(HR));V.screen="host";render();
    if(!await startHost()){V.err=t("err_net_restore");render()}
    return;
   }
  }else{V.screen="player";render();return playerResume()}
  setSession(null);
 }
 V.screen=urlRoom?"join":"home";render();
}

function onHostState(st){
 V.state=st;
 if(!st.started){G=null;store.del(hostGameKey(st.code));return}
 // Load or create the host's tracker for this deal.
 const key=st.roles.map(r=>r.id+r.role).join(",");
 if(!G||G.key!==key){
  const saved=store.get(hostGameKey(st.code));
  if(saved&&saved.key===key)G=saved;
  else{
   G={key,round:st.game.round||1,stage:st.game.stage==="day"?"day":"night",dead:{},log:[],votes:{},night:{},showRoles:false};
   st.players.forEach(p=>{if(p.dead)G.dead[p.id]=true});
  }
 }
}

// ---------- host game tracker (runs on the host's device) ----------
const roleOf=id=>V.state.roles.find(r=>r.id===id)?.role;
const nameOf=id=>V.state.players.find(p=>p.id===id)?.name||"?";
const aliveIds=()=>V.state.players.map(p=>p.id).filter(id=>!G.dead[id]);
const aliveRole=k=>aliveIds().find(id=>roleOf(id)===k);
function winner(){
 const a=aliveIds(),m=a.filter(i=>isMafia(roleOf(i))).length,mn=a.filter(i=>roleOf(i)==="man").length,c=a.length-m-mn;
 if(!m&&!mn)return "civ";
 if(mn&&m+c<=1)return "man";
 if(!mn&&m>=c)return "maf";
 return "";
}
function saveG(){
 store.set(hostGameKey(V.state.code),G);
 emit("host:game",{code:V.state.code,hostToken:V.session.token,game:{
  stage:G.stage,round:G.round,winner:winner(),dead:Object.keys(G.dead).filter(k=>G.dead[k]).map(Number)}});
}
function opts(sel,phone){return `<option value="">${phone!=null?t("by_phone",esc(nameOf(phone))):t("nobody")}</option>`+aliveIds().map(i=>`<option value="${i}" ${String(i)===String(sel)?"selected":""}>${esc(nameOf(i))}</option>`).join("")}

// Winner code -> text in the current language.
function winText(w){return w==="civ"||w==="man"||w==="maf"?t("win_"+w):w}
// Log entries are stored as [stageKey, round, key, ...args] so they follow the chosen language.
function logText(l){return typeof l==="string"?l:`${t(l[0],l[1])}: ${t(l[2],...l.slice(3))}`}
// Votes = votes from phones + the host's manual correction.
function totalVotes(i){return Math.max(0,(rs.voteTally(HR)[i]||0)+(G.votes[i]||0))}
function hostGame(st){
 const a=aliveIds(),w=winner(),night=G.stage==="night";
 let h=`<h1>${t(night?"night_n":"day_n",G.round)}</h1><p class="sub">${t("host_title",esc(st.code),a.length,st.players.length)}</p>`;
 if(w)h+=`<div class="card center" style="border-color:var(--ac)"><b style="font-size:20px">${winText(w)}</b><button class="big mt" id="again">${t("new_game")}</button></div>`;
 h+=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><b>${t("players")}</b><button class="sec sm" id="tr">${t(G.showRoles?"hide_roles":"show_roles")}</button></div>`
 +st.players.map(p=>{const r=R[roleOf(p.id)];return `<div class="pl ${G.dead[p.id]?"dead":""}"><span><span class="dot ${p.connected?"":"off"}"></span><span class="n">${G.dead[p.id]?"💀":"🙂"} ${esc(p.name)}</span>${G.showRoles&&r?` · ${r.e} ${roleName(roleOf(p.id))}`:""}</span><button class="x tg" data-i="${p.id}" style="font-size:14px">${t(G.dead[p.id]?"revive":"out")}</button></div>`}).join("")+`</div>`;
 if(!w&&night){
  const picks=rs.pickList(HR);
  const who=k=>{const l=picks.filter(x=>x.kind===k);return `<div class="picks">${l.length?l.map(x=>`📱 ${esc(nameOf(x.id))} → <b>${esc(nameOf(x.target))}</b>`).join(" · "):t("not_picked_yet")}</div>`};
  const f=(k,l,s)=>s?`<label class="fl">${l}<select data-k="${k}">${opts(G.night[k]??"",rs.phoneChoice(HR,k))}</select></label>${who(k)}`:"";
  const anyMafia=a.some(i=>isMafia(roleOf(i)));
  const actors=a.filter(i=>Object.keys(rs.actionsFor(HR,i)).length),done=actors.filter(i=>Object.keys(rs.actionsFor(HR,i)).every(k=>picks.some(x=>x.id===i&&x.kind===k)));
  h+=`<div class="card"><b>${t("night_actions")}</b><div class="sub" style="text-align:left;margin:4px 0 0">${t("night_progress",done.length,actors.length)}</div>`
   +f("dn",t("f_dn"),aliveRole("don")!==undefined)
   +f("mk",t("f_mk"),anyMafia)
   +f("mn",t("f_mn"),aliveRole("man")!==undefined)
   +f("dc",t("f_dc"),aliveRole("doc")!==undefined||aliveRole("nurse")!==undefined)
   +f("ms",t("f_ms"),aliveRole("mis")!==undefined)
   +f("dt",t("f_dt"),aliveRole("det")!==undefined||aliveRole("ast")!==undefined)
   +`<button class="big" id="en" style="margin-top:14px">${t("end_night")}</button></div>`;
 }else if(!w){
  const picks=rs.pickList(HR).filter(x=>x.kind==="vote");
  h+=`<div class="card"><b>${t("voting")}</b><div class="sub" style="text-align:left;margin:4px 0 0">${t("vote_progress",picks.length,a.length)}</div>`
   +(picks.length?`<div class="picks">${picks.map(x=>`📱 ${esc(nameOf(x.id))} → <b>${esc(nameOf(x.target))}</b>`).join(" · ")}</div>`:"")
   +a.map(i=>`<div class="pl"><span>${esc(nameOf(i))}</span><span><button class="sec vb" data-i="${i}" data-d="-1" style="padding:4px 14px">−</button> <b style="display:inline-block;min-width:28px;text-align:center">${totalVotes(i)}</b> <button class="vb" data-i="${i}" data-d="1" style="padding:4px 14px">+</button></span></div>`).join("")
   +`<button class="big" id="ev" style="margin-top:14px">${t("end_vote")}</button><button class="sec big" id="sk" style="margin-top:8px">${t("no_exile")}</button></div>`;
 }
 h+=`<div class="card"><b>${t("log")}</b> <span class="sub">${t("log_host_only")}</span>`+(G.log.length?G.log.slice().reverse().map(l=>`<div class="lg">${logText(l)}</div>`).join(""):`<p class="sub" style="margin:8px 0 0;text-align:left">${t("empty")}</p>`)+`</div>`
 +`<div class="card"><b>${t("host_menu")}</b><p class="sub" style="text-align:left;margin:6px 0 10px">${t("room_link",esc(inviteLink(st.code)))}</p>`
 +`<button class="sec big" id="reset">${t("back_lobby")}</button><button class="sec big mt" id="close">${t("close_room")}</button></div>`;
 return h;
}
function bindHostGame(st){
 const pre=()=>[G.stage==="night"?"lg_night":"lg_day",G.round];
 const reset=async()=>{
  const r=await emit("host:reset",{code:st.code,hostToken:V.session.token});
  if(r.ok){onHostState(r.state);render()}
 };
 $("tr").onclick=()=>{G.showRoles=!G.showRoles;store.set(hostGameKey(st.code),G);render()};
 app.querySelectorAll("select").forEach(s=>s.onchange=()=>{G.night[s.dataset.k]=s.value;store.set(hostGameKey(st.code),G)});
 app.querySelectorAll(".tg").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;G.dead[i]=!G.dead[i];G.log.push([...pre(),"lg_manual",esc(nameOf(i)),!!G.dead[i]]);saveG();render()});
 app.querySelectorAll(".vb").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ph=rs.voteTally(HR)[i]||0;G.votes[i]=Math.max(-ph,(G.votes[i]||0)+ +b.dataset.d);store.set(hostGameKey(st.code),G);render()});
 const en=$("en");if(en)en.onclick=endNight;
 const ev=$("ev");if(ev)ev.onclick=()=>endVote(false);
 const sk=$("sk");if(sk)sk.onclick=()=>endVote(true);
 const ag=$("again");if(ag)ag.onclick=reset;
 $("reset").onclick=()=>{if(confirm(t("confirm_reset")))reset()};
 $("close").onclick=()=>{if(confirm(t("confirm_close")))goHome()};
}
function endNight(){
 const n=G.night,nm=i=>esc(nameOf(i)),L=(k,...a)=>G.log.push(["lg_night",G.round,k,...a]);
 // Manual choice wins; otherwise use what players picked on their phones.
 const g=k=>n[k]!==undefined&&n[k]!==""?+n[k]:rs.phoneChoice(HR,k);
 const mk=g("mk"),mn=g("mn"),dc=g("dc"),ms=g("ms"),dt=g("dt"),dn=g("dn"),R0=G.round;
 const blocked=id=>id!==undefined&&id===ms;
 if(ms!==null)L("lg_blocked",nm(ms));
 let saved=null;
 if(dc!==null){
  // The nurse heals only after the doctor is out.
  const doc=aliveRole("doc"),nurse=aliveRole("nurse"),healer=doc!==undefined?doc:nurse;
  if(healer!==undefined&&!blocked(healer)){saved=dc;L("lg_healed",nm(dc));if(dc===healer)HR.selfHealUsed[healer]=true}else L("lg_heal_fail",nm(dc));
 }
 if(dt!==null){
  const det=aliveRole("det"),checker=det!==undefined?det:aliveRole("ast");
  if(blocked(checker)){L("lg_det_fail");if(checker!==undefined)rs.addNote(HR,checker,{k:"blocked",r:R0})}
  else{const res=isMafia(roleOf(dt));L("lg_det",nm(dt),res);if(checker!==undefined)rs.addNote(HR,checker,{k:"dt",r:R0,n:nameOf(dt),v:res})}
 }
 if(dn!==null){
  const don=aliveRole("don");
  if(blocked(don)){L("lg_don_fail");if(don!==undefined)rs.addNote(HR,don,{k:"blocked",r:R0})}
  else{const res=roleOf(dn)==="det";L("lg_don",nm(dn),res);if(don!==undefined)rs.addNote(HR,don,{k:"dn",r:R0,n:nameOf(dn),v:res})}
 }
 HR.lastBlock=ms;
 let any=false;
 [[mk,"maf"],[mn,"man"]].forEach(([tg,by])=>{
  if(tg===null)return;
  if(by==="man"&&blocked(aliveRole("man"))){L("lg_man_blocked");return}
  if(tg===saved){L("lg_saved",by,nm(tg));return}
  if(!G.dead[tg]){G.dead[tg]=true;any=true;L("lg_killed",by,nm(tg))}
 });
 if(!any)L("lg_nobody_died");
 G.stage="day";G.votes={};G.night={};saveG();render();
}
function endVote(skip){
 const a=aliveIds();let max=0;a.forEach(i=>max=Math.max(max,totalVotes(i)));
 const top=a.filter(i=>totalVotes(i)===max),D=(k,...x)=>G.log.push(["lg_day",G.round,k,...x]);
 if(skip||max===0)D("lg_no_exile");
 else if(top.length>1)D("lg_tie",top.map(i=>esc(nameOf(i))).join(", "),max);
 else{G.dead[top[0]]=true;D("lg_exiled",esc(nameOf(top[0])),max)}
 G.round++;G.stage="night";G.votes={};saveG();render();
}

boot();
</script>
